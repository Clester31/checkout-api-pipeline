name: checkout-api CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build checkout-api
        run: docker build -t checkout-api:ci .

      - name: Test checkout-api
        run: |
          docker run -d -p 8000:8000 --name checkout-api-test checkout-api:ci
          sleep 3
          curl -f http://localhost:8000/health
          docker rm -f checkout-api-test

      - name: Validate scaling policy
        run: |
          test -f scaling-policy.yml || { echo "scaling-policy.yml is missing"; exit 1; }
          DEPLOYMENT_NAME=$(grep -A1 '^target:' scaling-policy.yml | grep 'deployment:' | awk '{print $2}')
          test -n "$DEPLOYMENT_NAME" || { echo "target.deployment is missing"; exit 1; }
          grep -q "name: $DEPLOYMENT_NAME" checkout-api-deployment.yml || {
            echo "scaling-policy.yml targets '$DEPLOYMENT_NAME', which checkout-api-deployment.yml does not define"
            exit 1
          }
          grep -q 'memory_mi:' scaling-policy.yml || { echo "threshold.memory_mi is missing"; exit 1; }
          grep -q 'replicas:' scaling-policy.yml || { echo "action.replicas is missing"; exit 1; }
          echo "scaling-policy.yml is valid and targets a real Deployment"
